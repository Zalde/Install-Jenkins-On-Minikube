# Development environment overlay
# - Single replica
# - Lower resource limits
# - Faster deployment for testing

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base configuration
bases:
  - ../../base

# Environment-specific labels
commonLabels:
  environment: dev

# Environment-specific annotations
commonAnnotations:
  environment: development
  description: "Development environment for testing and learning"

# Patches for dev environment
patchesJson6902:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: jenkins
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
        value: 30
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 60

# Patches for Ingress
patchesStrategicMerge:
  - ingress-patch.yaml

# ConfigMap for dev-specific JCasC config
configMapGenerator:
  - name: jenkins-casc-config-dev
    behavior: merge
    literals:
      - JENKINS_ENV=development
      - LOG_LEVEL=DEBUG
