# Prometheus configuration as ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'minikube'
        environment: 'dev'

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    # Rule files
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Jenkins metrics (via JMX or Prometheus plugin)
      - job_name: 'jenkins'
        static_configs:
          - targets: ['jenkins.jenkins.svc.cluster.local:8080']
        metrics_path: '/prometheus'
        scrape_interval: 30s
        scrape_timeout: 10s

  alert-rules.yml: |
    groups:
      - name: jenkins
        interval: 30s
        rules:
          - alert: JenkinsPodDown
            expr: up{job="jenkins"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Jenkins pod is down"
              description: "Jenkins pod has been unreachable for 5 minutes"

          - alert: JenkinsHighMemoryUsage
            expr: container_memory_usage_bytes{pod=~"jenkins.*"} / container_spec_memory_limit_bytes{pod=~"jenkins.*"} > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Jenkins memory usage is high"
              description: "Jenkins memory usage is above 90%"

          - alert: JenkinsHighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{pod=~"jenkins.*"}[5m]) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Jenkins CPU usage is high"
              description: "Jenkins CPU usage is above 80% for 10 minutes"

          - alert: KubernetesNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Kubernetes node is not ready"
              description: "{{ $labels.node }} has been unready for 5 minutes"

          - alert: KubernetesPVCFull
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "PVC is almost full"
              description: "PVC {{ $labels.persistentvolumeclaim }} is 90% full"
